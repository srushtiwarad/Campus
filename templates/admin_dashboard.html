<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: url("{{ url_for('static', filename='bg1.jpg') }}")
                        no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 15px;
            width: 1100px;
        }

        h2 { text-align: center; color: #00796b; margin-bottom: 20px; }

        .logout {
            float: right;
            background: #d32f2f;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        th {
            background: #00796b;
            color: white;
        }

        tr:hover { background: #f1f1f1; }

        select {
            padding: 5px;
            border-radius: 6px;
        }

        button {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            color: white;
        }

        .update-btn { background: #388e3c; }
        .delete-btn { background: #d32f2f; }

        .status-Pending { color: orange; font-weight: bold; }
        .status-In-Progress { color: blue; font-weight: bold; }
        .status-Resolved { color: green; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="/logout" class="logout">Logout</a>
    <h2>Admin Dashboard</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Title</th>
            <th>Category</th>
            <th>Description</th>
            <th>Status</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>

        {% for comp in complaints %}
        <tr>
            <td>{{ comp.id }}</td>
            <td>{{ comp.student }}</td>
            <td>{{ comp.title }}</td>
            <td>{{ comp.category }}</td>
            <td>{{ comp.description }}</td>

            <td class="status-{{ comp.status|replace(' ', '-') }}">
                {{ comp.status }}
            </td>

            <!-- UPDATE STATUS -->
            <td>
                <form method="POST" action="/update_status">
                    <input type="hidden" name="id" value="{{ comp.id }}">
                    <select name="status">
                        <option value="Pending" {% if comp.status=='Pending' %}selected{% endif %}>Pending</option>
                        <option value="In Progress" {% if comp.status=='In Progress' %}selected{% endif %}>In Progress</option>
                        <option value="Resolved" {% if comp.status=='Resolved' %}selected{% endif %}>Resolved</option>
                    </select>
                    <button class="update-btn">Update</button>
                </form>
            </td>

            <!-- DELETE -->
            <td>
                <form method="POST"
                      action="/delete_complaint/{{ comp.id }}"
                      onsubmit="return confirm('Delete this complaint?');">
                    <button class="delete-btn">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
